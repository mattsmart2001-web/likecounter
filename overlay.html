  <title>Track Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .track-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #track-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #progressRect {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-dim {
      fill: rgba(255, 255, 255, 0.08);
    }

    .track-fill {
      fill: url(#trackGrad);
      filter:
        drop-shadow(0 0 6px rgba(255, 51, 102, 0.9))
        drop-shadow(0 0 16px rgba(255, 107, 53, 0.55))
        drop-shadow(0 0 32px rgba(255, 51, 102, 0.3));
    }

    .track-stroke {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 1.5;
    }
  </style>

  <script>
    const MAX_LIKES = 100;
    const CLIP_H    = 360; // matches progressRect height (viewBox 349 + buffer)

    const progressRect = document.getElementById('progressRect');

    function updateTrack(count) {
      const progress   = Math.min(count / MAX_LIKES, 1);
      const translateY = CLIP_H * (1 - progress);
      progressRect.style.transform = `translateY(${translateY}px)`;
    }

    // Initialise from whatever the main page has already stored
    let count = parseInt(localStorage.getItem('likeCount') || '0', 10);
    updateTrack(count);

    // React to updates from the main page (same-origin cross-tab)
    window.addEventListener('storage', (e) => {
      if (e.key === 'likeCount') {
        count = parseInt(e.newValue || '0', 10);
        updateTrack(count);
      }
    });
  </script>
