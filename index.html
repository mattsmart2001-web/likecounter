<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dragon Trail — Like Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    /* ── Track ─────────────────────────────────────────────── */
    .track-wrap {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #track-svg { width: 100%; height: 100%; }

    #progressRect {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-dim {
      fill: rgba(255, 255, 255, 0.08);
    }

    .track-fill {
      fill: url(#trackGrad);
      filter:
        drop-shadow(0 0 6px  rgba(255,  51, 102, 0.90))
        drop-shadow(0 0 16px rgba(255, 107,  53, 0.55))
        drop-shadow(0 0 32px rgba(255,  51, 102, 0.30));
    }

    .track-stroke {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 1.5;
    }

    /* ── Optional count badge ───────────────────────────────── */
    #count-badge {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 51, 102, 0.9), 0 0 30px rgba(255, 107, 53, 0.5);
      z-index: 50;
      pointer-events: none;
      display: none;
    }

    #test-btn {
      position: fixed;
      bottom: 14px;
      right: 56px;
      padding: 6px 14px;
      background: rgba(255, 51, 102, 0.75);
      border: none;
      border-radius: 7px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      z-index: 200;
      font-family: inherit;
      transition: background 0.15s;
    }
    #test-btn:hover { background: rgba(255, 51, 102, 1); }


    /* ── Config panel ───────────────────────────────────────── */
    #config {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(8, 8, 18, 0.97);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      padding: 18px 20px 22px;
      z-index: 190;
      max-height: 80vh;
      overflow-y: auto;
    }

    #config h2 {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 14px;
    }

    .cfg-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .cfg-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 140px;
    }

    label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }

    input, select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      color: #fff;
      font-size: 0.82rem;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: rgba(255, 51, 102, 0.55);
      background: rgba(255, 255, 255, 0.10);
    }
    select option { background: #111; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    .btn {
      padding: 8px 18px;
      border-radius: 7px;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      letter-spacing: 0.03em;
    }
    .btn:hover { opacity: 0.82; }
    .btn-primary { background: #ff3366; color: #fff; }
    .btn-ghost   { background: rgba(255, 255, 255, 0.10); color: rgba(255, 255, 255, 0.75); }
    .btn-danger  { background: rgba(255, 80,  80, 0.20); color: #f87171; }

    #status {
      margin-top: 10px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.35);
      min-height: 1.1em;
      line-height: 1.4;
    }
    #status.ok   { color: #4ade80; }
    #status.err  { color: #f87171; }
    #status.warn { color: #fbbf24; }
  </style>
</head>

  <!-- Optional like counter badge -->
  <div id="count-badge">0</div>

  <!-- Test like button (visible in browser, unobtrusive in OBS) -->
  <button id="test-btn" onclick="addLike()" title="Test like">+1</button>

  <!-- Config panel -->
  <div id="config">
    <h2>Stream config</h2>

    <div class="cfg-row">
      <div class="cfg-field">
        <label>Platform</label>
        <select id="platform" onchange="onPlatformChange()">
          <option value="twitch">Twitch</option>
          <option value="youtube">YouTube</option>
        </select>
      </div>

      <!-- Twitch only -->
      <div class="cfg-field" id="field-channel">
        <label>Channel name</label>
        <input id="channel" type="text" placeholder="yourchannelname" autocomplete="off"/>
      </div>

      <!-- YouTube only -->
      <div class="cfg-field" id="field-apikey" style="display:none">
        <label>YouTube API Key</label>
        <input id="apikey" type="password" placeholder="AIza…" autocomplete="off"/>
      </div>
      <div class="cfg-field" id="field-videoid" style="display:none">
        <label>Live Video ID</label>
        <input id="videoid" type="text" placeholder="dQw4w9WgXcQ" autocomplete="off"/>
      </div>
    </div>

    <div class="cfg-row">
      <div class="cfg-field">
        <label>Chat trigger (word or emoji in message)</label>
        <input id="trigger" type="text" placeholder="!like  or  ❤️" value="!like"/>
      </div>
      <div class="cfg-field">
        <label>Max likes (= 100 % fill)</label>
        <input id="maxlikes" type="number" value="100" min="1" max="99999"/>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="connect()">Connect</button>
      <button class="btn btn-ghost"   onclick="disconnect()">Disconnect</button>
      <button class="btn btn-ghost"   onclick="toggleBadge()">Toggle counter</button>
      <button class="btn btn-danger"  onclick="resetCount()">Reset count</button>
    </div>

    <div id="status"></div>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────
    let count    = 0;
    let maxLikes = 100;
    let ws       = null;   // Twitch WebSocket
    let ytTimer  = null;   // YouTube poll timer
    let ytToken  = null;   // YouTube nextPageToken
    let ytChatId = null;   // YouTube liveChatId

    const progressRect = document.getElementById('progressRect');
    const countBadge   = document.getElementById('count-badge');
    const statusEl     = document.getElementById('status');
    const CLIP_H = 360; // matches progressRect height

    // ── Persistence ────────────────────────────────────────────
    function loadConfig() {
      const cfg = JSON.parse(localStorage.getItem('streamCfg') || '{}');

      if (cfg.platform)  document.getElementById('platform').value  = cfg.platform;
      if (cfg.channel)   document.getElementById('channel').value   = cfg.channel;
      if (cfg.apikey)    document.getElementById('apikey').value    = cfg.apikey;
      if (cfg.videoid)   document.getElementById('videoid').value   = cfg.videoid;
      if (cfg.trigger)   document.getElementById('trigger').value   = cfg.trigger;
      if (cfg.maxlikes)  document.getElementById('maxlikes').value  = cfg.maxlikes;

      maxLikes = parseInt(cfg.maxlikes || '100', 10);
      count    = parseInt(localStorage.getItem('likeCount') || '0', 10);

      countBadge.textContent = count;
      if (cfg.badgeVisible) countBadge.style.display = 'block';

      onPlatformChange();
      updateTrack();

      // Auto-connect if credentials were previously saved
      if (cfg.platform === 'twitch' && cfg.channel) {
        connect();
      } else if (cfg.platform === 'youtube' && cfg.apikey && cfg.videoid) {
        connect();
      }
    }

    function saveConfig() {
      localStorage.setItem('streamCfg', JSON.stringify({
        platform:     document.getElementById('platform').value,
        channel:      document.getElementById('channel').value,
        apikey:       document.getElementById('apikey').value,
        videoid:      document.getElementById('videoid').value,
        trigger:      document.getElementById('trigger').value,
        maxlikes:     document.getElementById('maxlikes').value,
        badgeVisible: countBadge.style.display === 'block',
      }));
    }

    // ── Track fill ─────────────────────────────────────────────
    function updateTrack() {
      const progress   = Math.min(count / maxLikes, 1);
      const translateY = CLIP_H * (1 - progress);
      progressRect.style.transform = `translateY(${translateY}px)`;
    }

    function addLike() {
      count++;
      localStorage.setItem('likeCount', count);
      countBadge.textContent = count;
      updateTrack();
    }

    function resetCount() {
      count = 0;
      localStorage.setItem('likeCount', '0');
      countBadge.textContent = '0';
      updateTrack();
    }

    // ── UI ─────────────────────────────────────────────────────
    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className   = type;
    }

    function onPlatformChange() {
      const isYT = document.getElementById('platform').value === 'youtube';
      document.getElementById('field-channel').style.display = isYT ? 'none' : '';
      document.getElementById('field-apikey').style.display  = isYT ? ''     : 'none';
      document.getElementById('field-videoid').style.display = isYT ? ''     : 'none';
    }

    function toggleBadge() {
      countBadge.style.display = countBadge.style.display === 'block' ? 'none' : 'block';
      saveConfig();
    }

    // ── Twitch IRC (anonymous WebSocket — no auth needed) ──────
    function connectTwitch(channel, trigger) {
      setStatus('Connecting to Twitch…', 'warn');
      ws = new WebSocket('wss://irc-ws.chat.twitch.tv');

      ws.onopen = () => {
        ws.send('NICK justinfan' + Math.floor(Math.random() * 80000 + 1000));
        ws.send('JOIN #' + channel.toLowerCase());
        setStatus(`Connected — listening in #${channel} for "${trigger}"`, 'ok');
      };

      ws.onmessage = (e) => {
        if (e.data.startsWith('PING')) {
          ws.send('PONG :tmi.twitch.tv');
          return;
        }
        if (e.data.includes('PRIVMSG')) {
          const match = e.data.match(/PRIVMSG #\S+ :(.*)/);
          if (match && match[1].toLowerCase().includes(trigger.toLowerCase())) {
            addLike();
          }
        }
      };

      ws.onerror = () => setStatus('Twitch WebSocket error.', 'err');
      ws.onclose = () => { if (ws) setStatus('Disconnected from Twitch.', 'err'); };
    }

    // ── YouTube Live Chat (API key + video ID) ─────────────────
    async function connectYouTube(apiKey, videoId, trigger) {
      setStatus('Fetching live stream details…', 'warn');
      try {
        const res  = await fetch(
          `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${apiKey}`
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        ytChatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
        if (!ytChatId) throw new Error('No active live chat found for this video ID.');

        setStatus(`Connected — polling for "${trigger}"`, 'ok');
        pollYT(apiKey, trigger);
      } catch (err) {
        setStatus('YouTube error: ' + err.message, 'err');
      }
    }

    async function pollYT(apiKey, trigger) {
      if (!ytChatId) return;
      try {
        let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${ytChatId}&part=snippet&key=${apiKey}&maxResults=200`;
        if (ytToken) url += `&pageToken=${ytToken}`;

        const res  = await fetch(url);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        // Skip the initial batch of messages (only count new ones going forward)
        if (ytToken) {
          for (const msg of (data.items || [])) {
            const text = msg.snippet?.displayMessage || '';
            if (text.toLowerCase().includes(trigger.toLowerCase())) addLike();
          }
        }

        ytToken = data.nextPageToken;
        ytTimer = setTimeout(() => pollYT(apiKey, trigger), data.pollingIntervalMillis || 5000);
      } catch (err) {
        setStatus('YouTube poll error: ' + err.message, 'err');
      }
    }

    // ── Connect / Disconnect ───────────────────────────────────
    function connect() {
      disconnect();
      saveConfig();

      maxLikes = parseInt(document.getElementById('maxlikes').value, 10) || 100;
      const platform = document.getElementById('platform').value;
      const trigger  = (document.getElementById('trigger').value.trim()) || '!like';

      if (platform === 'twitch') {
        const channel = document.getElementById('channel').value.trim();
        if (!channel) { setStatus('Enter a channel name.', 'err'); return; }
        connectTwitch(channel, trigger);
      } else {
        const apiKey  = document.getElementById('apikey').value.trim();
        const videoId = document.getElementById('videoid').value.trim();
        if (!apiKey || !videoId) { setStatus('Enter your API key and Video ID.', 'err'); return; }
        connectYouTube(apiKey, videoId, trigger);
      }
    }

    function disconnect() {
      if (ws)      { ws.close(); ws = null; }
      if (ytTimer) { clearTimeout(ytTimer); ytTimer = null; }
      ytToken  = null;
      ytChatId = null;
    }

    // ── Init ───────────────────────────────────────────────────
    loadConfig();
  </script>
</body>
</html>
