<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Like Counter</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0d0d1a;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      color: #fff;
    }

    /* Animated background orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: #ff3366; top: -100px; left: -100px; animation-delay: 0s; }
    .orb-2 { width: 350px; height: 350px; background: #7c3aed; bottom: -80px; right: -80px; animation-delay: -4s; }
    .orb-3 { width: 250px; height: 250px; background: #f97316; top: 50%; left: 50%; animation-delay: -8s; }

    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(40px, 30px) scale(1.15); }
    }

    /* Card */
    .card {
      position: relative;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 32px;
      padding: 56px 64px;
      text-align: center;
      backdrop-filter: blur(24px);
      box-shadow: 0 0 60px rgba(255,51,102,0.1), 0 24px 80px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      margin-bottom: 24px;
    }

    /* Count display */
    .count-wrap {
      position: relative;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .count {
      font-size: 5.5rem;
      font-weight: 800;
      line-height: 1;
      background: linear-gradient(135deg, #ff3366 0%, #ff6b6b 40%, #ffd93d 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      transition: transform 0.1s;
      user-select: none;
    }

    .count.bump {
      animation: bump 0.35s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
    }
    @keyframes bump {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.22); }
      60%  { transform: scale(0.92); }
      80%  { transform: scale(1.07); }
      100% { transform: scale(1); }
    }

    /* Floating +1 labels */
    .floater {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.4rem;
      font-weight: 800;
      color: #ff3366;
      pointer-events: none;
      animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-70px) scale(0.6); }
    }

    /* Button */
    .like-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 18px 48px;
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #fff;
      background: linear-gradient(135deg, #ff3366, #ff6b35);
      border: none;
      border-radius: 100px;
      cursor: pointer;
      box-shadow: 0 0 0 0 rgba(255,51,102,0.5), 0 8px 24px rgba(255,51,102,0.35);
      transition: transform 0.15s, box-shadow 0.15s;
      overflow: hidden;
    }

    .like-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, #ff6b35, #ff3366);
      opacity: 0;
      transition: opacity 0.3s;
      border-radius: inherit;
    }

    .like-btn:hover::before { opacity: 1; }
    .like-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 0 0 0 rgba(255,51,102,0.3), 0 16px 40px rgba(255,51,102,0.5);
    }
    .like-btn:active {
      transform: scale(0.94) translateY(0);
    }

    .like-btn.pulse {
      animation: pulse-ring 0.5s ease-out;
    }
    @keyframes pulse-ring {
      0%   { box-shadow: 0 0 0 0 rgba(255,51,102,0.7), 0 8px 24px rgba(255,51,102,0.35); }
      100% { box-shadow: 0 0 0 24px rgba(255,51,102,0), 0 8px 24px rgba(255,51,102,0.35); }
    }

    .heart-icon {
      font-size: 1.3rem;
      display: inline-block;
      position: relative;
      z-index: 1;
      transition: transform 0.2s;
    }
    .like-btn:active .heart-icon {
      transform: scale(1.4);
    }

    .btn-label { position: relative; z-index: 1; }

    /* Streak badge */
    .streak {
      margin-top: 24px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      color: rgba(255,255,255,0.35);
      transition: color 0.3s;
    }
    .streak.hot { color: #ffd93d; }
    .streak-icon { font-size: 1.1rem; }

    /* Particles canvas */
    #particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <canvas id="particles"></canvas>

  <div class="card">
    <h1>Total Likes</h1>
    <div class="count-wrap">
      <div class="count" id="count">0</div>
    </div>
    <button class="like-btn" id="likeBtn" onclick="handleLike()">
      <span class="heart-icon">❤️</span>
      <span class="btn-label">Like</span>
    </button>
    <div class="streak" id="streak">click to get started</div>
  </div>

  <script>
    let count = 0;
    let streak = 0;
    let lastClick = 0;
    const STREAK_WINDOW = 1200; // ms

    const countEl  = document.getElementById('count');
    const btnEl    = document.getElementById('likeBtn');
    const streakEl = document.getElementById('streak');
    const canvas   = document.getElementById('particles');
    const ctx      = canvas.getContext('2d');
    const particles = [];

    // ── Resize canvas ──────────────────────────────────────────────
    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // ── Particle system ────────────────────────────────────────────
    const COLORS = ['#ff3366','#ff6b6b','#ffd93d','#ff6b35','#c084fc','#60a5fa'];

    function spawnParticles(x, y, count = 18) {
      for (let i = 0; i < count; i++) {
        const angle  = Math.random() * Math.PI * 2;
        const speed  = 2 + Math.random() * 6;
        const size   = 3 + Math.random() * 5;
        const life   = 0.7 + Math.random() * 0.5;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 3,
          size,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          alpha: 1,
          decay: 1 / (life * 60),
          shape: Math.random() > 0.5 ? 'circle' : 'star',
        });
      }
    }

    function drawStar(ctx, x, y, r) {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a1 = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const a2 = ((i * 4 + 2) * Math.PI) / 5 - Math.PI / 2;
        const px = x + Math.cos(a1) * r;
        const py = y + Math.sin(a1) * r;
        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
        ctx.lineTo(x + Math.cos(a2) * (r * 0.4), y + Math.sin(a2) * (r * 0.4));
      }
      ctx.closePath();
      ctx.fill();
    }

    function tickParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.18; // gravity
        p.alpha -= p.decay;
        if (p.alpha <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        if (p.shape === 'star') {
          drawStar(ctx, p.x, p.y, p.size);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(tickParticles);
    }
    tickParticles();

    // ── Main click handler ─────────────────────────────────────────
    function handleLike() {
      const now = Date.now();
      count++;

      // Streak logic
      if (now - lastClick < STREAK_WINDOW) {
        streak++;
      } else {
        streak = 1;
      }
      lastClick = now;

      // Update count with animation
      countEl.classList.remove('bump');
      void countEl.offsetWidth; // reflow
      countEl.textContent = count.toLocaleString();
      countEl.classList.add('bump');

      // Button pulse
      btnEl.classList.remove('pulse');
      void btnEl.offsetWidth;
      btnEl.classList.add('pulse');

      // Floating +1
      const floater = document.createElement('span');
      floater.className = 'floater';
      floater.textContent = streak > 2 ? `+${streak} 🔥` : '+1';
      floater.style.left = `${40 + Math.random() * 20}%`;
      countEl.parentElement.appendChild(floater);
      floater.addEventListener('animationend', () => floater.remove());

      // Streak UI
      updateStreak();

      // Particles from button
      const rect = btnEl.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const burstCount = Math.min(8 + streak * 2, 40);
      spawnParticles(cx, cy, burstCount);
    }

    function updateStreak() {
      if (streak >= 10) {
        streakEl.textContent = `🔥 ${streak}x COMBO — you're on fire!`;
        streakEl.className = 'streak hot';
      } else if (streak >= 5) {
        streakEl.textContent = `⚡ ${streak}x streak — keep going!`;
        streakEl.className = 'streak hot';
      } else if (streak >= 2) {
        streakEl.textContent = `✨ ${streak}x streak`;
        streakEl.className = 'streak hot';
      } else {
        streakEl.textContent = `${count.toLocaleString()} like${count !== 1 ? 's' : ''} total`;
        streakEl.className = 'streak';
      }
    }
  </script>
</body>
</html>
