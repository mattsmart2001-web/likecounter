<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Like Counter — Track Overlay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: transparent;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #fff;
    }

    /* ── Track ─────────────────────────────────────────────── */
    .track-wrap {
      position: fixed;
      top: 0; left: 0; right: 0;
      bottom: var(--panel-h, 185px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #track-svg { width: 100%; height: 100%; }

    #progressRect {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .track-dim  { fill: rgba(255, 255, 255, 0.08); }

    .track-fill {
      fill: url(#trackGrad);
      filter:
        drop-shadow(0 0 6px  rgba(255,  51, 102, 0.90))
        drop-shadow(0 0 16px rgba(255, 107,  53, 0.55))
        drop-shadow(0 0 32px rgba(255,  51, 102, 0.30));
    }

    .track-stroke {
      fill: none;
      stroke: rgba(255, 255, 255, 0.35);
      stroke-width: 1.5;
    }

    /* ── Config panel ───────────────────────────────────────── */
    #config {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(8, 8, 18, 0.97);
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      padding: 18px 20px 22px;
      z-index: 190;
      max-height: 80vh;
      overflow-y: auto;
    }

    #config h2 {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 14px;
    }

    .cfg-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      align-items: flex-end;
    }

    .cfg-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 140px;
    }

    label {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.38);
    }

    input, select {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 7px;
      color: #fff;
      font-size: 0.82rem;
      padding: 7px 10px;
      outline: none;
      width: 100%;
      font-family: inherit;
    }
    input:focus, select:focus {
      border-color: rgba(255, 51, 102, 0.55);
      background: rgba(255, 255, 255, 0.10);
    }
    select option { background: #111; }

    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }

    .btn {
      padding: 8px 18px;
      border-radius: 7px;
      border: none;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      letter-spacing: 0.03em;
    }
    .btn:hover { opacity: 0.82; }
    .btn-primary { background: #ff3366; color: #fff; }
    .btn-ghost   { background: rgba(255, 255, 255, 0.10); color: rgba(255, 255, 255, 0.75); }
    .btn-danger  { background: rgba(255, 80,  80, 0.20); color: #f87171; }

    #status {
      margin-top: 10px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.35);
      min-height: 1.1em;
      line-height: 1.4;
    }
    #status.ok   { color: #4ade80; }
    #status.err  { color: #f87171; }
    #status.warn { color: #fbbf24; }
  </style>
</head>
<body>

  <!-- ── Track map ─────────────────────────────────────────── -->
  <div class="track-wrap">
    <svg id="track-svg" viewBox="0 0 624 349"
         preserveAspectRatio="xMidYMid meet"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="trackGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%"   stop-color="#ff3366"/>
          <stop offset="50%"  stop-color="#ff6b35"/>
          <stop offset="100%" stop-color="#ffd93d"/>
        </linearGradient>
        <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <clipPath id="progressClip">
          <rect id="progressRect"
                x="-10" y="0" width="644" height="360"
                style="transform: translateY(360px)"/>
        </clipPath>
      </defs>

      <!-- 1. Dim base — always visible so shape is legible at 0% -->
      <path id="track-dim-path" class="track-dim" fill-rule="evenodd" d=""/>

      <!-- 2. Rising gradient fill -->
      <path id="track-fill-path" class="track-fill" fill-rule="evenodd" clip-path="url(#progressClip)" d=""/>

      <!-- 3. Outline always on top -->
      <path id="track-stroke-path" class="track-stroke" d=""/>

      <!-- Centre badge: emoji + count -->
      <g id="count-badge" style="display:none">
        <text id="badge-icon" x="312" y="168"
              text-anchor="middle" dominant-baseline="middle"
              font-size="16" style="user-select:none">👍</text>
        <text id="count-text" x="312" y="185"
              text-anchor="middle" dominant-baseline="middle"
              font-family="'Segoe UI', system-ui, sans-serif"
              font-size="18" font-weight="800" letter-spacing="1"
              fill="#fff"
              filter="url(#glowFilter)">0</text>
      </g>
    </svg>
  </div>

  <!-- Config panel -->
  <div id="config">
    <h2>Stream config</h2>

    <div class="cfg-row">
      <div class="cfg-field">
        <label>Track</label>
        <select id="trackSelect" onchange="onTrackChange()">
          <option value="Dragon Trail">Dragon Trail</option>
          <option value="Alsace">Alsace</option>
          <option value="Autopolis">Autopolis</option>
          <option value="Bathurst">Bathurst</option>
          <option value="Brands Hatch">Brands Hatch</option>
          <option value="Catalunya">Catalunya</option>
          <option value="Fuji">Fuji</option>
          <option value="Goodwood">Goodwood</option>
          <option value="Interlagos">Interlagos</option>
          <option value="Kyoto">Kyoto</option>
          <option value="Lago">Lago</option>
          <option value="Laguna Seca">Laguna Seca</option>
          <option value="Le Mans">Le Mans</option>
          <option value="Monza">Monza</option>
          <option value="Nordschleife">Nordschleife</option>
          <option value="Red Bull Ring">Red Bull Ring</option>
          <option value="Route X">Route X</option>
          <option value="Sainte-Croix">Sainte-Croix</option>
          <option value="Sardegna">Sardegna</option>
          <option value="Spa">Spa</option>
          <option value="Suzuka">Suzuka</option>
          <option value="Tokyo">Tokyo</option>
          <option value="Tsukuba">Tsukuba</option>
          <option value="Willow Springs">Willow Springs</option>
        </select>
      </div>

      <div class="cfg-field">
        <label>Platform</label>
        <select id="platform" onchange="onPlatformChange()">
          <option value="twitch">Twitch</option>
          <option value="youtube">YouTube</option>
        </select>
      </div>

      <!-- Twitch only -->
      <div class="cfg-field" id="field-channel">
        <label>Channel name</label>
        <input id="channel" type="text" placeholder="yourchannelname" autocomplete="off"/>
      </div>

      <!-- YouTube only -->
      <div class="cfg-field" id="field-apikey" style="display:none">
        <label>YouTube API Key</label>
        <input id="apikey" type="password" placeholder="AIza…" autocomplete="off"/>
      </div>
      <div class="cfg-field" id="field-videoid" style="display:none">
        <label>Live Video ID</label>
        <input id="videoid" type="text" placeholder="dQw4w9WgXcQ" autocomplete="off"/>
      </div>
    </div>

    <div class="cfg-row">
      <div class="cfg-field">
        <label>Chat trigger (word or emoji in message)</label>
        <input id="trigger" type="text" placeholder="!like  or  ❤️" value="!like"/>
      </div>
      <div class="cfg-field">
        <label>Max likes (= 100 % fill)</label>
        <input id="maxlikes" type="number" value="100" min="1" max="99999"/>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="connect()">Connect</button>
      <button class="btn btn-ghost"   onclick="disconnect()">Disconnect</button>
      <button class="btn btn-ghost"   onclick="toggleBadge()">Toggle counter</button>
      <button class="btn btn-danger"  onclick="resetCount()">Reset count</button>
      <button class="btn btn-ghost"   onclick="addLike()">+1 test</button>
    </div>

    <div id="status"></div>
  </div>

    // ── State ──────────────────────────────────────────────────
    let count    = 0;
    let maxLikes = 100;
    let CLIP_H   = 360;
    let ws       = null;
    let ytTimer  = null;
    let ytToken  = null;
    let ytChatId = null;

    const trackSvg       = document.getElementById('track-svg');
    const progressRect   = document.getElementById('progressRect');
    const dimPath        = document.getElementById('track-dim-path');
    const fillPath       = document.getElementById('track-fill-path');
    const strokePath     = document.getElementById('track-stroke-path');
    const countBadge     = document.getElementById('count-badge');
    const countText      = document.getElementById('count-text');
    const badgeIcon      = document.getElementById('badge-icon');
    const statusEl       = document.getElementById('status');

    // ── Track switching ────────────────────────────────────────

    // Sample N points along the path and return their average position.
    // For a closed racing circuit this lands naturally in the infield.
    function pathCentroid(pathEl, samples = 200) {
      const len = pathEl.getTotalLength();
      let sx = 0, sy = 0;
      for (let i = 0; i < samples; i++) {
        const pt = pathEl.getPointAtLength((i / samples) * len);
        sx += pt.x;
        sy += pt.y;
      }
      return { x: sx / samples, y: sy / samples };
    }

    function loadTrack(name) {
      const t = TRACKS[name];
      if (!t) return;

      CLIP_H = t.clipH;

      trackSvg.setAttribute('viewBox', t.viewBox);

      // Update clip rect dimensions
      const vbParts = t.viewBox.split(' ');
      const vbW = parseFloat(vbParts[2]);
      progressRect.setAttribute('width',  vbW + 20);
      progressRect.setAttribute('height', t.clipH);

      // Update all three path layers
      dimPath.setAttribute('d',    t.path);
      fillPath.setAttribute('d',   t.path);
      strokePath.setAttribute('d', t.path);

      // Reposition badge at the true infield centre of this circuit
      const { x: cx, y: cy } = pathCentroid(strokePath);
      badgeIcon.setAttribute('x', cx);
      badgeIcon.setAttribute('y', cy - 9);
      countText.setAttribute('x', cx);
      countText.setAttribute('y', cy + 9);

      updateTrack();
    }

    function onTrackChange() {
      const name = document.getElementById('trackSelect').value;
      loadTrack(name);
      saveConfig();
    }

    // ── Persistence ────────────────────────────────────────────
    function loadConfig() {
      const cfg = JSON.parse(localStorage.getItem('streamCfg') || '{}');

      if (cfg.track)    document.getElementById('trackSelect').value = cfg.track;
      if (cfg.platform) document.getElementById('platform').value    = cfg.platform;
      if (cfg.channel)  document.getElementById('channel').value     = cfg.channel;
      if (cfg.apikey)   document.getElementById('apikey').value      = cfg.apikey;
      if (cfg.videoid)  document.getElementById('videoid').value     = cfg.videoid;
      if (cfg.trigger)  document.getElementById('trigger').value     = cfg.trigger;
      if (cfg.maxlikes) document.getElementById('maxlikes').value    = cfg.maxlikes;

      maxLikes = parseInt(cfg.maxlikes || '100', 10);
      count    = parseInt(localStorage.getItem('likeCount') || '0', 10);

      countText.textContent = count;
      if (cfg.badgeVisible) countBadge.style.display = 'inline';

      // Load the selected track (default to Dragon Trail)
      const trackName = cfg.track || 'Dragon Trail';
      const trackSel = document.getElementById('trackSelect');
      if ([...trackSel.options].some(o => o.value === trackName)) {
        trackSel.value = trackName;
      }
      loadTrack(trackSel.value);

      onPlatformChange();

      if (cfg.platform === 'twitch' && cfg.channel) {
        connect();
      } else if (cfg.platform === 'youtube' && cfg.apikey && cfg.videoid) {
        connect();
      }
    }

    function saveConfig() {
      localStorage.setItem('streamCfg', JSON.stringify({
        track:        document.getElementById('trackSelect').value,
        platform:     document.getElementById('platform').value,
        channel:      document.getElementById('channel').value,
        apikey:       document.getElementById('apikey').value,
        videoid:      document.getElementById('videoid').value,
        trigger:      document.getElementById('trigger').value,
        maxlikes:     document.getElementById('maxlikes').value,
        badgeVisible: countBadge.style.display === 'inline',
      }));
    }

    // ── Track fill ─────────────────────────────────────────────
    function updateTrack() {
      const progress   = Math.min(count / maxLikes, 1);
      const translateY = CLIP_H * (1 - progress);
      progressRect.style.transform = `translateY(${translateY}px)`;
    }

    function addLike() {
      count++;
      localStorage.setItem('likeCount', count);
      countText.textContent = count;
      updateTrack();
    }

    function resetCount() {
      count = 0;
      localStorage.setItem('likeCount', '0');
      countText.textContent = '0';
      updateTrack();
    }

    // ── UI ─────────────────────────────────────────────────────
    function setStatus(msg, type = '') {
      statusEl.textContent = msg;
      statusEl.className   = type;
    }

    function onPlatformChange() {
      const isYT = document.getElementById('platform').value === 'youtube';
      document.getElementById('field-channel').style.display = isYT ? 'none' : '';
      document.getElementById('field-apikey').style.display  = isYT ? ''     : 'none';
      document.getElementById('field-videoid').style.display = isYT ? ''     : 'none';
    }

    function toggleBadge() {
      countBadge.style.display = countBadge.style.display === 'inline' ? 'none' : 'inline';
      saveConfig();
    }

    // ── Twitch IRC ─────────────────────────────────────────────
    function connectTwitch(channel, trigger) {
      setStatus('Connecting to Twitch…', 'warn');
      ws = new WebSocket('wss://irc-ws.chat.twitch.tv');

      ws.onopen = () => {
        ws.send('NICK justinfan' + Math.floor(Math.random() * 80000 + 1000));
        ws.send('JOIN #' + channel.toLowerCase());
        setStatus(`Connected — listening in #${channel} for "${trigger}"`, 'ok');
      };

      ws.onmessage = (e) => {
        if (e.data.startsWith('PING')) { ws.send('PONG :tmi.twitch.tv'); return; }
        if (e.data.includes('PRIVMSG')) {
          const match = e.data.match(/PRIVMSG #\S+ :(.*)/);
          if (match && match[1].toLowerCase().includes(trigger.toLowerCase())) addLike();
        }
      };

      ws.onerror = () => setStatus('Twitch WebSocket error.', 'err');
      ws.onclose = () => { if (ws) setStatus('Disconnected from Twitch.', 'err'); };
    }

    // ── YouTube Live Chat ──────────────────────────────────────
    async function connectYouTube(apiKey, videoId, trigger) {
      setStatus('Fetching live stream details…', 'warn');
      try {
        const res  = await fetch(
          `https://www.googleapis.com/youtube/v3/videos?part=liveStreamingDetails&id=${videoId}&key=${apiKey}`
        );
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        ytChatId = data.items?.[0]?.liveStreamingDetails?.activeLiveChatId;
        if (!ytChatId) throw new Error('No active live chat found for this video ID.');

        setStatus(`Connected — polling for "${trigger}"`, 'ok');
        pollYT(apiKey, trigger);
      } catch (err) {
        setStatus('YouTube error: ' + err.message, 'err');
      }
    }

    async function pollYT(apiKey, trigger) {
      if (!ytChatId) return;
      try {
        let url = `https://www.googleapis.com/youtube/v3/liveChat/messages?liveChatId=${ytChatId}&part=snippet&key=${apiKey}&maxResults=200`;
        if (ytToken) url += `&pageToken=${ytToken}`;

        const res  = await fetch(url);
        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        if (ytToken) {
          for (const msg of (data.items || [])) {
            const text = msg.snippet?.displayMessage || '';
            if (text.toLowerCase().includes(trigger.toLowerCase())) addLike();
          }
        }

        ytToken = data.nextPageToken;
        ytTimer = setTimeout(() => pollYT(apiKey, trigger), data.pollingIntervalMillis || 5000);
      } catch (err) {
        setStatus('YouTube poll error: ' + err.message, 'err');
      }
    }

    // ── Connect / Disconnect ───────────────────────────────────
    function connect() {
      disconnect();
      saveConfig();

      maxLikes = parseInt(document.getElementById('maxlikes').value, 10) || 100;
      const platform = document.getElementById('platform').value;
      const trigger  = (document.getElementById('trigger').value.trim()) || '!like';

      if (platform === 'twitch') {
        const channel = document.getElementById('channel').value.trim();
        if (!channel) { setStatus('Enter a channel name.', 'err'); return; }
        connectTwitch(channel, trigger);
      } else {
        const apiKey  = document.getElementById('apikey').value.trim();
        const videoId = document.getElementById('videoid').value.trim();
        if (!apiKey || !videoId) { setStatus('Enter your API key and Video ID.', 'err'); return; }
        connectYouTube(apiKey, videoId, trigger);
      }
    }

    function disconnect() {
      if (ws)      { ws.close(); ws = null; }
      if (ytTimer) { clearTimeout(ytTimer); ytTimer = null; }
      ytToken  = null;
      ytChatId = null;
    }

    // ── Init ───────────────────────────────────────────────────
    function syncPanelHeight() {
      const h = document.getElementById('config').offsetHeight;
      document.documentElement.style.setProperty('--panel-h', h + 'px');
    }
    new ResizeObserver(syncPanelHeight).observe(document.getElementById('config'));

    loadConfig();
  </script>
